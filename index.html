<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Baseline metadata for consumers that do NOT execute JavaScript — AI agents,
       link unfurlers and crawlers that only read the raw HTML. React renders the
       per-page title/description/canonical on top (React 19 native document
       metadata, see src/components/Seo.jsx) and de-duplicates against these, so
       a JS-capable client still gets the route-specific values.
       Previously these lived only in React, which meant a plain `curl` of the
       page returned no title, description or canonical at all. -->
  <title data-static-meta>Selestial | Universe of Silver</title>
  <meta data-static-meta name="description"
    content="Premium 925 sterling silver jewellery — rings, chains, bracelets and earrings crafted with celestial precision. Free shipping over $100." />
  <link data-static-meta rel="canonical" href="https://selestial-lovat.vercel.app/" />
  <meta name="theme-color" content="#000000" />

  <!-- Critical styles for the static hero below. Inline so the first paint needs
       no stylesheet round trip. Kept deliberately tiny — everything else still
       comes from the built stylesheet. -->
  <style>
    html, body { margin: 0; background: #000; }
    #lcp-hero {
      position: absolute; top: 0; left: 0; width: 100%; height: 65vh;
      overflow: hidden; background: #000; z-index: 0;
    }
    #lcp-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @media (min-width: 768px) { #lcp-hero { height: 80vh; } }
  </style>

  <!-- Google Fonts, loaded without blocking the first paint.
       Marked `media="print"` so it is fetched at low priority and does not block
       render; main.jsx promotes it to `media="all"` on boot, and the <noscript>
       copy keeps it working without JS. The promotion lives in the bundle rather
       than an inline onload handler so it survives a future script-src CSP on
       the HTML document. Combined with display=swap, text paints immediately in
       the fallback face instead of waiting on fonts.googleapis.com. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link data-defer-style
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" media="print" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet" />
  </noscript>

  <!-- Preload the LCP hero image. Must mirror the <picture> in StaticImage.jsx
       (AVIF, 480/768w) or the browser preloads a file the page never uses. -->
  <link rel="preload" as="image" type="image/avif"
        imagesrcset="/img/hero_1-480.avif 480w, /img/hero_1-768.avif 768w"
        imagesizes="100vw" fetchpriority="high" />

  <!-- Organization + WebSite JSON-LD structured data -->
  <script type="application/ld+json">
  [
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Selestial",
      "url": "https://selestial-lovat.vercel.app",
      "logo": "https://selestial-lovat.vercel.app/SVG/SELESTIAL.LGOG%20IN%20WHITE.svg?v=2",
      "description": "Premium 925 sterling silver jewellery brand. Rings, chains, bracelets and earrings crafted with celestial precision.",
      "sameAs": [
        "https://www.instagram.com/selestial",
        "https://www.pinterest.com/selestial"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "hello@selestial.com"
      }
    },
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Selestial",
      "url": "https://selestial-lovat.vercel.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://selestial-lovat.vercel.app/products?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  ]
  </script>
</head>

<body>
  <!-- Static first paint of the hero image.
       This app is client-rendered, so without this nothing can appear until
       ~95KB of compressed JS downloads and boots — Lighthouse measured the hero
       image fully downloaded at ~1s but held back by 2.7s of pure "render
       delay", which is what capped the mobile score.
       This element paints straight from HTML, so it becomes the Largest
       Contentful Paint candidate immediately.
       It MUST live outside #root and must never be removed: React replacing it
       would retire this LCP candidate and push the metric back out to whenever
       React rendered. Once the app mounts, its own hero (and the opaque
       CanvasBackground) simply paint over this layer, so it is never visible at
       the same time as the real hero and no duplicate download occurs — the
       <img> below, the preload above, and StaticImage.jsx all request the exact
       same URLs.
       Keep the srcset in sync with src/components/StaticImage.jsx. -->
  <div id="lcp-hero" aria-hidden="true">
    <img src="/img/hero_1-768.avif"
         srcset="/img/hero_1-480.avif 480w, /img/hero_1-768.avif 768w"
         sizes="100vw" alt="" width="1024" height="1024"
         fetchpriority="high" decoding="sync" />
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
